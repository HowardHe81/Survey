<style>

:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1f2328; --muted:#5f6b7a; --line:#dde1e6;
  --accent:#1f5fa8; --accent-soft:#e8f0fa; --ok:#1e7a46; --ok-soft:#e6f4ec;
  --warn:#a8540f; --warn-soft:#fdf0e3; --err:#b42318; --err-soft:#fdecea; --hl:#fff6d6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  font-size:16px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.96);backdrop-filter:blur(4px);
  border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}
.prog{flex:1;min-width:160px;height:8px;background:#e3e7ec;border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.progtxt{font-size:13px;color:var(--muted);white-space:nowrap}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 22px;margin:18px 0}
h1{font-size:24px;margin:6px 0 4px;line-height:1.4}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:17px;margin:18px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tag{display:inline-block;font-size:13px;padding:1px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.btns{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:10px 18px}

.field{margin:16px 0}
.field>.lab{display:block;font-weight:600;margin-bottom:6px}

.opts label{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:#fff;font-size:15px}
.opts input{margin-right:6px}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
input[type=text],input[type=email],textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
.err{color:var(--err);font-size:14px;margin-top:4px}
.ok{color:var(--ok);font-size:14px}

.bar{flex:1;min-width:220px}
.scale{position:relative;height:30px;margin-top:4px}
.track{position:absolute;left:0;right:0;top:12px;height:6px;background:#e6e9ee;border-radius:9px}

.steps button{padding:3px 10px;font-size:13px;color:var(--ink)}
.steps button.fin{border-color:#b7dcc6;background:var(--ok-soft);color:var(--ink)}

.example .tip{font-size:14px;color:var(--muted)}

const store = {
  get() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(STORE); } catch (e) {} },
};

const blank = () => ({ step: 0, consent: false, name: '', email: '', bg: {}, ans: {}, other: {}, submitted: false });
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let showErrIntro = false;
const idErr = k => { const v = String(S[k] || '').trim();
  if (!v) return k === 'name' ? '請填寫姓名或暱稱' : '請填寫 E-mail';
  if (k === 'email' && !EMAIL_RE.test(v)) return 'E-mail 格式不正確';
  return ''; };
const needId = () => !!CONFIG.SUBMIT_URL && !expertId;   // 正式模式必須使用帶 ?id= 的專屬連結
const introOk = () => !needId() && S.consent && !idErr('name') && !idErr('email');
let S = store.get() || blank();
const confirmReset = () => { try { return window.confirm('確定要清除本機上的填答紀錄並重新填寫嗎？（已送出的資料不受影響）'); } catch (e) { return true; } };
const save = () => store.set(S);

// ---------- steps ----------
const STEPS = round === 2
  ? [{ id: 'intro' }, ...CONS.map((c, i) => ({ id: 'cons', ci: i })), { id: 'review' }]
  : [{ id: 'intro' }, { id: 'bg' }, ...CONS.map((c, i) => ({ id: 'cons', ci: i })), { id: 'other' }, { id: 'review' }];

function itemState(code) {
  const a = S.ans[code] || {};
  const isNum = v => v !== '' && v !== undefined && v !== null && Number.isInteger(Number(v)) && Number(v) >= 0 && Number(v) <= 10;
  const need = ['c', 'o'].concat(CONFIG.SINGLE_VALUE ? ['s'] : []);
  const filled = need.every(k => isNum(a[k]));
  const partial = need.some(k => a[k] !== '' && a[k] !== undefined);
  let msg = '';
  for (const k of need) if (a[k] !== '' && a[k] !== undefined && !isNum(a[k])) msg = '請填 0 到 10 的整數。';
  if (!msg && isNum(a.c) && isNum(a.o) && Number(a.c) > Number(a.o)) msg = '最保守認知值不可高於最樂觀認知值，請調整。';
  if (!msg && CONFIG.SINGLE_VALUE && isNum(a.s) && isNum(a.c) && isNum(a.o) && (Number(a.s) < Number(a.c) || Number(a.s) > Number(a.o)))
    msg = '單一重要性值應介於保守值與樂觀值之間。';
  return { ok: filled && !msg, filled, partial, msg };
}
const doneCount = () => ALLITEMS.filter(it => itemState(it.code).ok).length;
const bgOk = () => BG.every(q => {
  const v = S.bg[q.k];
  if (!v || !String(v).trim()) return false;
  if (q.other && (v === '其他' || (q.k === 'coi' && v === '是')) && !String(S.bg[q.k + '_o'] || '').trim()) return false;
  return true;
});
const screened = () => BG.some(q => q.screen && S.bg[q.k] === q.screen);
function stepOk(st) {
  if (st.id === 'intro') { showErrIntro = true; return introOk(); }
  if (st.id === 'bg') return bgOk() && !screened();
  if (st.id === 'cons') return CONS[st.ci].items.every(it => itemState(it.code).ok);
  return true;
}

function progress() {
  const pct = Math.round(doneCount() / ALLITEMS.length * 100);
  $('#progbar').style.width = pct + '%';
  $('#progtxt').textContent = `已完成 ${doneCount()}／${ALLITEMS.length} 項準則`;
}

function nav(back, next, nextLabel = '下一步') {
  const st = STEPS[S.step];
  const b = el('div', { class: 'btns' },
    back ? el('button', { onclick: () => go(S.step - 1) }, '上一步') : el('span'),
    next ? el('button', { class: 'primary', id: 'nextbtn', onclick: () => tryNext() }, nextLabel) : null);
  return b;
}
function tryNext() {
  const st = STEPS[S.step];
  if (!stepOk(st)) {
    render(true);
    const first = document.querySelector('.crit.bad, .err');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  go(S.step + 1);
}
function go(i) { S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(); window.scrollTo(0, 0); }

function stepper() {
  const box = el('div', { class: 'steps' });
  const add = (id, label, fin, title) => {
    const si = STEPS.findIndex(s => s.id === id.id && (id.ci === undefined || s.ci === id.ci));
    if (si < 0) return;
    box.append(el('button', { class: (S.step === si ? 'cur ' : '') + (fin ? 'fin' : ''), title: title || label,
      onclick: () => { if (id.id === 'intro' || id.id === 'bg' || round === 2 || stepOk(STEPS[1])) go(si); } }, label));
  };
  add({ id: 'intro' }, '問卷說明', introOk());
  if (round === 1) add({ id: 'bg' }, '專家背景資料', bgOk() && !screened());
  CONS.forEach((c, i) => add({ id: 'cons', ci: i }, c.abbr, c.items.every(it => itemState(it.code).ok), c.name));
  if (round === 1) add({ id: 'other' }, '其他建議', false);
  return box;
}

      el('p', { class: 'small' }, el('b', {}, '最保守認知值'), '＝您認為該準則重要程度最低可能是幾分；', el('b', {}, '最樂觀認知值'), '＝最高可能是幾分。' + (CONFIG.SINGLE_VALUE ? '另請填「單一重要性值」，代表最可能的重要程度。' : '')),
      el('details', { class: 'sug exsum' }, el('summary', {}, '再看一次填答說明與範例'), exampleBlock()),
      el('p', { class: 'small muted' }, '若您認為準則名稱或定義需修正、應合併或刪除，請點開各準則下方的「修正建議」填寫。'));
  }
  c.append(stepper());
  c.append(el('h2', { style: 'margin-top:14px' }, `構面${'一二三四五六七'[DATA.cons.findIndex(x => x.abbr === con.abbr)]}：${con.name}`),
    el('div', { class: 'cdef' }, el('b', {}, '構面定義：'), con.def));
  con.items.forEach(it => {
    const st = itemState(it.code);
    const box = el('div', { class: 'crit ' + (st.ok ? 'done' : (showErr || st.msg) && (showErr || st.partial) ? 'bad' : ''), id: 'c_' + it.code });
    box.append(el('div', { class: 'chead' }, el('span', { class: 'code' }, it.code), el('span', { class: 'cname' }, it.name)),
      el('div', { class: 'cdesc' }, it.def), el('div', { class: 'csit' }, it.sit));
    if (round === 2 && CONFIG.ROUND2[it.code])
      box.append(el('div', { class: 'fb' }, `第一輪全體專家：最保守認知值幾何平均數 ${CONFIG.ROUND2[it.code].CM.toFixed(2)}；最樂觀認知值幾何平均數 ${CONFIG.ROUND2[it.code].OM.toFixed(2)}`));
    const a = S.ans[it.code] = S.ans[it.code] || { c: '', o: '', s: '', note: '' };
    const mk = (k, lab) => {
      const inp = el('input', { type: 'number', min: 0, max: 10, step: 1, inputmode: 'numeric', value: a[k], 'aria-label': `${it.code} ${lab}` });
      inp.addEventListener('input', () => { a[k] = inp.value; save(); refreshItem(it.code); });
      return el('label', { class: 'vbox' }, el('span', {}, lab), inp);
    };
    const vals = el('div', { class: 'vals' }, mk('c', '最保守認知值'), mk('o', '最樂觀認知值'), CONFIG.SINGLE_VALUE ? mk('s', '單一重要性值') : null, scaleBar(it.code));
    box.append(vals, el('div', { class: 'msg' }, st.msg ? el('div', { class: 'err' }, st.msg) : (showErr && !st.filled ? el('div', { class: 'err' }, '此題尚未填寫完整') : null)));
    const det = el('details', { class: 'sug' }, el('summary', {}, '修正建議（選填）'));
    if (a.note) det.open = true;
    const ta = el('textarea', { placeholder: '例如：建議更名為…／與某準則合併／定義不清楚之處…' }); ta.value = a.note || '';
    ta.addEventListener('input', () => { a.note = ta.value; save(); });
    det.append(ta); box.append(det);
    c.append(box);
  });
  c.append(nav(true, true, ci === CONS.length - 1 ? (round === 2 ? '檢視並送出' : '下一步') : '下一個構面'));
  return c;
}
function refreshItem(code) {
  const box = document.getElementById('c_' + code); if (!box) return;
  const st = itemState(code);
  box.className = 'crit ' + (st.ok ? 'done' : st.msg ? 'bad' : '');
  box.querySelector('.msg').replaceChildren(st.msg ? el('div', { class: 'err' }, st.msg) : '');
  const old = box.querySelector('.bar'); old.replaceWith(scaleBar(code));
  progress();
  const sb = document.querySelector('.steps'); if (sb) sb.replaceWith(stepper());
}

function pOther() {
  const c = el('div', { class: 'card' });
  c.append(stepper(), el('h2', { style: 'margin-top:14px' }, '參、其他建議'), el('p', {}, '若您認為有本問卷未涵蓋、但對軟體開發人員採用 AI 程式開發代理人具重要影響之因素，或對構面分類有其他意見，敬請說明（選填）：'));
  [['add', '建議新增之準則'], ['merge', '建議合併或刪除之準則'], ['cons', '構面分類之意見'], ['misc', '其他']].forEach(([k, lab]) => {
    const ta = el('textarea'); ta.value = S.other[k] || '';
    ta.addEventListener('input', () => { S.other[k] = ta.value; save(); });
    c.append(el('div', { class: 'field' }, el('div', { class: 'lab' }, lab), ta));
  });
  c.append(nav(true, true, '檢視並送出'));
  return c;
}

function payload() {
  const rows = ALLITEMS.map(it => ({ code: it.code, c: Number(S.ans[it.code].c), o: Number(S.ans[it.code].o),
    ...(CONFIG.SINGLE_VALUE ? { s: Number(S.ans[it.code].s) } : {}), note: S.ans[it.code].note || '' }));
  return { stage: 'FDM', round, expertId: expertId || '', name: (S.name || '').trim(), email: (S.email || '').trim(), submittedAt: new Date().toISOString(), submitCount: (S.count || 0) + 1,
    singleValue: CONFIG.SINGLE_VALUE, background: round === 2 ? {} : S.bg, answers: rows, other: round === 2 ? {} : S.other, ua: navigator.userAgent };
}
function pReview() {
  const c = el('div', { class: 'card review' });
  const allOk = ALLITEMS.every(it => itemState(it.code).ok) && (round === 2 || bgOk());
  c.append(el('h2', {}, '檢視與送出'), el('p', { class: 'muted small' }, '請確認以下填答；點選構面代號可回到該頁修改。'));
  const tb = el('table', {}, el('tr', {}, el('th', {}, '編號'), el('th', {}, '準則'), el('th', {}, '保守'), el('th', {}, '樂觀'), CONFIG.SINGLE_VALUE ? el('th', {}, '單一') : null, el('th', {}, '狀態')));
  ALLITEMS.forEach(it => {
    const a = S.ans[it.code] || {}; const st = itemState(it.code);
    tb.append(el('tr', {}, el('td', {}, it.code), el('td', {}, it.name), el('td', { class: 'n' }, a.c ?? ''), el('td', { class: 'n' }, a.o ?? ''),
      CONFIG.SINGLE_VALUE ? el('td', { class: 'n' }, a.s ?? '') : null, el('td', {}, el('span', { class: 'pill ' + (st.ok ? 'ok' : 'no') }, st.ok ? '完成' : '未完成'))));
  });
  c.append(stepper(), tb);
  const msg = el('div', { id: 'submitmsg' });
  const label = S.submitted ? '修改後重新送出' : (CONFIG.SUBMIT_URL ? '送出問卷' : '送出（示範模式）');
  const btn = el('button', { class: 'primary', onclick: () => {
    if (S.submitted) { let ok = true; try { ok = window.confirm('您已送出過本問卷。重新送出將以這次的內容為準，確定要重新送出嗎？'); } catch (e) {} if (!ok) return; }
    submit(btn, msg); } }, label);
  if (!allOk) btn.disabled = true;
  c.append(el('div', { class: 'btns' }, el('button', { onclick: () => go(S.step - 1) }, '上一步'), btn), msg);
  if (!allOk) msg.append(el('div', { class: 'err' }, '尚有未完成之題目，請點選構面代號回到該頁補填。'));
  if (S.submitted) msg.append(thanks('您已送出本問卷，感謝您的協助！', '若需修改，可點選構面代號回到該頁修改後，再按「修改後重新送出」，研究者將以最後一次送出的內容為準。'),
    el('button', { class: 'link', onclick: () => { if (confirmReset()) { S = blank(); store.clear(); render(); window.scrollTo(0, 0); } } }, '清除並重新填寫一份（同一台電腦有其他專家要填答時使用）'));
  return c;
}
const thanks = (a, b) => el('div', { class: 'thanks' }, a, b ? el('small', {}, b) : null);
async function submit(btn, msg) {
  btn.disabled = true; msg.replaceChildren(el('p', { class: 'muted' }, '送出中…'));
  const data = payload();
  if (!CONFIG.SUBMIT_URL) {
    S.submitted = true; S.count = (S.count || 0) + 1; save();
    btn.disabled = false; btn.textContent = '修改後重新送出';
    msg.replaceChildren(thanks('感謝您完成本問卷！', '示範模式：資料未儲存。以下為正式施測時會送到 Google 試算表的內容：'),
      el('pre', { class: 'json' }, JSON.stringify(data, null, 1)),
      el('button', { onclick: () => { S = blank(); store.clear(); render(); window.scrollTo(0, 0); } }, '清除並重新示範'));
    return;
  }
  try {
    await fetch(CONFIG.SUBMIT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    S.submitted = true; S.count = (S.count || 0) + 1; save();
    btn.disabled = false; btn.textContent = '修改後重新送出';
    msg.replaceChildren(thanks('已送出，感謝您的協助！', '您可以關閉此頁面。若需修改填答，可回到該頁修改後再按「修改後重新送出」。'));
  } catch (e) {
    btn.disabled = false;
    msg.replaceChildren(el('div', { class: 'err' }, '送出失敗，請確認網路連線後再試一次；若仍無法送出，請下載填答檔寄至 ' + CONFIG.CONTACT + '。'),
      el('button', { onclick: () => { const b = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(b);
        const a = el('a', { href: u, download: `FDM_round${round}_${expertId || 'expert'}.json` }); document.body.append(a); a.click(); a.remove(); } }, '下載填答檔'));
  }
}

function render(showErr = false) {
  const st = STEPS[S.step] || STEPS[0];
  const app = $('#app'); app.replaceChildren();
  $('#banner').replaceChildren(CONFIG.SUBMIT_URL ? '' : el('div', { class: 'banner' }, '示範模式：送出後資料不會儲存（研究者尚未設定送出網址）。' + (round === 1 ? ' ' : ''),
    el('button', { class: 'link', onclick: () => { location.search = round === 2 ? '' : '?round=2'; } }, round === 2 ? '切換回第一輪' : '預覽第二輪畫面')));
  if (st.id === 'intro') app.append(pIntro());
  else if (st.id === 'bg') app.append(pBg(showErr));
  else if (st.id === 'cons') app.append(pCons(st.ci, showErr));
  else if (st.id === 'other') app.append(pOther());
  else app.append(pReview());
  const nb = $('#nextbtn'); if (nb && st.id === 'intro') nb.disabled = false;
  if (st.id === 'bg' && screened() && nb) nb.disabled = true;
  progress();
}
render();
</script>
</body>
</html>
